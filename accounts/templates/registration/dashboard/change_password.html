{% extends 'base.html' %}

{% load static %}

{% block content %}
  
    <!-- Dashboard Content Start -->
        <div class="container-fluid py-4">
            <div class="row">

                <!-- Sidebar -->
                {% include 'includes/dashboard_site_bar.html' %}

                <!-- Main Dashboard -->
                <div class="col-lg-9">
                    <!-- User Details Card -->
                    <div class="card shadow-sm border-0 mb-4">
                        {% if messages %}
                        <div class="alert-messages">
                            {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">
                                {{ message }}
                            </div>
                            {% endfor %}
                        </div>
                        {% endif %}
                        <div class="card-header bg-secondary text-white">
                            <h5 class="mb-0">Change password</h5>
                        </div>
                        <div class="card-body">
                            
                            <form method="POST" action="{% url 'change_password' %}"> 
                                {% csrf_token %}
                                <div class="form-outline mb-4">
                                        <label class="form-label">Current Password</label>
                                        <input type="password" class="form-control m-1" name="current_password" placeholder="Current Password" required="required" />
                                </div> 
                                <div class="form-outline mb-4">
                                        <label class="form-label">Create New Password</label>
                                        <input type="password" class="form-control m-1" name="new_password" placeholder="Create New Password" required="required" />
                                </div>
                                <div class="form-outline mb-4">
                                        <label class="form-label">Confirm New Password</label>
                                        <input type="password" class="form-control m-1" name="confirm_password" placeholder="Confirm New Password" required="required" />
                                </div>     
                                   
                                <input type="submit" value="submit" class="btn btn-primary"/>
                            </form>


                        </div>
                    </div>

                    <!-- Tracking Info -->
                    

                    <!-- Payment Info -->
                   

                    <!-- Order History -->
                   
                </div>

            </div>
        </div>
    <!-- Dashboard Content End -->


<!-- fadeout login validation messages  -->
<script>
  setTimeout(function(){
    $('#message-alert').fadeOut('slow')
}, 4000)
</script>
<!-- fadeout close -->

{% endblock %}
